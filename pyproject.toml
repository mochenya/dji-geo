[project]
name = "dji-geo"
version = "0.1.0"
description = "Python client for DJI GEO / FlySafe airspace data"
readme = "README.md"
authors = [{ name = "Jensen Chan" }]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.0",
    "pydantic>=2.10",
]

[project.urls]
Repository = "https://github.com/mochenya/dji-geo"
Issues = "https://github.com/mochenya/dji-geo/issues"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dji_geo"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src"]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
